[project]
name = "tshoot-agent"
version = "0.1.0"
description = "A small, read-only LangGraph network troubleshooting agent traced in Splunk"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "agent-control-evaluators>=8.12.0",
    "agent-control-sdk[galileo]>=8.12.0",
    "langchain>=1.2,<2",
    "langchain-aws>=1.2,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "langgraph>=1.2,<2",
    "splunk-ao>=0.4.0",
    "textual>=6,<8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
